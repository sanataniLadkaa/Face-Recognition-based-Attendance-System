<!DOCTYPE html>
<html>
<head>
    <title>Today's Attendance</title>
    <style>
        table {
            border-collapse: collapse;
            width: 60%;
        }
        th, td {
            border: 1px solid #dddddd;
            text-align: left;
            padding: 8px;
        }
        th {
            background-color: #4CAF50;
            color: white;
        }
    </style>
</head>
<body>
    <h2>📅 Attendance for {{ date }}</h2>
    {% if records %}
        <table>
            <tr>
                <th>Person</th>
                <th>Timestamp</th>
            </tr>
            {% for person, timestamp in records %}
            <tr>
                <td>{{ person }}</td>
                <td>{{ timestamp }}</td>
            </tr>
            {% endfor %}
        </table>
    {% else %}
        <p>No attendance records for today.</p>
    {% endif %}

    <br>
    <a href="/">⬅️ Back to Upload</a>
</body>
</html>

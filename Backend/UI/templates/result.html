<!DOCTYPE html>
<html>
<head>
    <title>Recognition Result</title>
</head>
<body>
    {% if status == "success" %}
        <h2>✅ Attendance Marked!</h2>
        <ul>
        {% for person in recognized_persons %}
            <li>{{ person }}</li>
        {% endfor %}
        </ul>
    {% elif status == "fail" %}
        <h2>❌ No Match Found</h2>
        <p>{{ reason }}</p>
    {% else %}
        <h2>⚠️ Error</h2>
        <p>{{ reason }}</p>
    {% endif %}
    <br>
    <a href="/">⬅️ Back to Upload</a>
</body>
</html>

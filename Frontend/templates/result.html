<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Recognition Result</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            padding: 40px;
        }
        .container {
            max-width: 500px;
            margin: auto;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            text-align: center;
        }
        h2 { margin-bottom: 16px; }
        ul { list-style: none; padding: 0; }
        li {
            background: #f1f8f4;
            margin: 8px 0;
            padding: 10px;
            border-radius: 4px;
        }
        .success { color: #2e7d32; }
        .error { color: #c62828; }
        .warning { color: #f57c00; }
        a {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            color: #2e7d32;
            font-weight: bold;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">

        {% if status == "success" %}
            <h2 class="success">✅ Attendance Marked</h2>
            <ul>
                {% for person in recognized_persons %}
                    <li>{{ person }}</li>
                {% endfor %}
            </ul>

        {% elif status == "fail" %}
            <h2 class="warning">❌ No Match Found</h2>
            <p>{{ error }}</p>

        {% else %}
            <h2 class="error">⚠️ Error</h2>
            <p>{{ error }}</p>
        {% endif %}

        <a href="/">⬅ Back to Upload</a>

    </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>User Dashboard</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    padding: 30px;
}

h2 { color:#333; }

.logout {
    float:right;
    background:#dc3545;
    color:white;
    padding:6px 12px;
    text-decoration:none;
    border-radius:4px;
}

.card {
    background:white;
    padding:20px;
    margin-top:20px;
    border-radius:6px;
}

button {
    background:#28a745;
    color:white;
    border:none;
    padding:10px 14px;
    border-radius:4px;
    cursor:pointer;
}

button:hover { opacity:0.9; }

table {
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
}

th, td {
    border:1px solid #ddd;
    padding:10px;
    text-align:center;
}

th {
    background:#007bff;
    color:white;
}

/* CHAT */
#chatBox {
    border:1px solid #ddd;
    height:260px;
    overflow-y:auto;
    padding:10px;
    background:#fafafa;
}

.me { text-align:right; color:green; }
.admin { text-align:left; color:#333; }

textarea {
    width:100%;
    padding:8px;
}
</style>
</head>

<body>

<a href="/logout" class="logout">Logout</a>
<h2>Welcome, {{ username }}</h2>

<!-- 📸 ATTENDANCE -->
<div class="card">
<h3>📸 Mark Attendance</h3>

<form id="attendanceForm" action="/recognize_face" method="post" enctype="multipart/form-data">
    <input type="file" name="file" accept="image/*" required>

    <!-- GPS hidden fields -->
    <input type="hidden" name="latitude" id="latitude">
    <input type="hidden" name="longitude" id="longitude">

    <button type="submit">Mark Attendance</button>
</form>

<p id="gpsStatus" style="margin-top:8px;font-size:14px;color:#ef6c00;"></p>
</div>

<!-- 📅 ATTENDANCE TABLE -->
<div class="card">
<h3>📅 Your Attendance</h3>

<table>
<thead>
<tr><th>Date</th><th>Time</th></tr>
</thead>
<tbody id="attendanceRows"></tbody>
</table>

<p id="emptyMsg" style="color:#666;display:none;">No records found.</p>
</div>

<!-- 💬 CHAT WITH ADMIN -->
<div class="card">
<h3>💬 Chat with Admin</h3>

<div id="chatBox">Loading chat...</div>

<br>

<form id="chatForm" enctype="multipart/form-data">
    <textarea name="message" placeholder="Type message..." required></textarea>
    <br><br>

    <input type="file" name="file">
    <br><br>

    <button type="submit">Send</button>
</form>
</div>

<!-- ================= GPS + LOGIC ================= -->
<script>
const gpsStatus = document.getElementById("gpsStatus");
const latInput = document.getElementById("latitude");
const lonInput = document.getElementById("longitude");
const attendanceForm = document.getElementById("attendanceForm");

function fetchLocationAndSubmit() {
    if (!navigator.geolocation) {
        alert("GPS not supported by browser");
        return;
    }

    gpsStatus.innerText = "📡 Fetching location...";
    gpsStatus.style.color = "#ef6c00";

    navigator.geolocation.getCurrentPosition(
        (position) => {
            latInput.value = position.coords.latitude;
            lonInput.value = position.coords.longitude;

            gpsStatus.innerText = "📍 Location detected";
            gpsStatus.style.color = "#2e7d32";

            // ✅ submit ONLY after GPS is ready
            attendanceForm.submit();
        },
        () => {
            alert("Location permission is required to mark attendance");
        },
        {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 0
        }
    );
}

// ⛔ Stop default submit
attendanceForm.addEventListener("submit", function (e) {
    e.preventDefault();
    fetchLocationAndSubmit();
});
</script>

<!-- ================= DATA LOAD ================= -->
<script>
/* LOAD ATTENDANCE */
fetch("/attendance/my")
.then(res => res.json())
.then(data => {
    const tbody = document.getElementById("attendanceRows");
    if (!data.length) {
        document.getElementById("emptyMsg").style.display="block";
        return;
    }
    data.forEach(r => {
        tbody.innerHTML += `<tr><td>${r.date}</td><td>${r.time}</td></tr>`;
    });
});

/* CHAT */
function loadChat() {
    fetch("/chat/user/history", { credentials: "include" })
        .then(res => res.json())
        .then(data => {
            const box = document.getElementById("chatBox");
            box.innerHTML = "";

            data.forEach(m => {
                box.innerHTML += `
                  <p class="${m.sender_role}">
                    <b>${m.sender_name}:</b> ${m.message ?? ""}
                  </p>`;
            });

            box.scrollTop = box.scrollHeight;
        });
}

loadChat();
setInterval(loadChat, 3000);

document.getElementById("chatForm").onsubmit = e => {
    e.preventDefault();

    fetch("/chat/user/send", {
        method: "POST",
        credentials: "include",
        body: new FormData(e.target)
    }).then(() => {
        e.target.reset();
        loadChat();
    });
};
</script>

</body>
</html>
